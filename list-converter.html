<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Delimiter Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>List to Delimited Text</h2>
    <textarea id="listInput" placeholder="Paste item list here (one per line or separated by commas)..."></textarea>
    <div class="btn-group">
      <button onclick="runListConvert(', ')">To Comma (,)</button>
      <button onclick="runListConvert('; ')">To Semicolon (;)</button>
      <button onclick="runListConvert(' | ')">To Pipe (|)</button>
      <button onclick="runListConvert('\n')">To Newlines</button>
      <button class="btn-sec" onclick="copyText('listInput')">Copy</button>
      <button class="btn-danger" onclick="clearText('listInput')">Clear</button>
    </div>
  </div>
  <script src="tools.js"></script>
</body>
</html>
