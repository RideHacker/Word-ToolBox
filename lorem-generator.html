<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Lorem Ipsum Generator</h2>
    <div class="controls">
      <input type="number" id="loremCount" value="3" min="1" max="50">
      <select id="loremType">
        <option value="paragraphs">Paragraphs</option>
        <option value="sentences">Sentences</option>
        <option value="words">Words</option>
      </select>
      <button onclick="runLorem()">Generate</button>
    </div>
    <textarea id="loremOutput" readonly placeholder="Generated text will appear here..."></textarea>
    <div class="btn-group">
      <button class="btn-sec" onclick="copyText('loremOutput')">Copy Text</button>
      <button class="btn-danger" onclick="clearText('loremOutput')">Clear</button>
    </div>
  </div>
  <script src="tools.js"></script>
</body>
</html>
